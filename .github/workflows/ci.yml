name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  windows-exe:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-exe.ps1
      - run: dist\LogiMxPlus.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: LogiMxPlus-windows
          path: dist/LogiMxPlus.exe
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/LogiMxPlus.exe --title ${{ github.ref_name }} --generate-notes
    permissions:
      contents: write
