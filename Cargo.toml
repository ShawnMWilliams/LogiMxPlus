[package]
name = "logimxplus"
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
description = "LogiMxPlus"
license = "MIT"
repository = "https://github.com/ShawnMWilliams/LogiMxPlus"

[[bin]]
name = "logimxplus"
path = "src/main.rs"

[dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
